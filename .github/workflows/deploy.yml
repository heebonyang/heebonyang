name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: heebonyang
          channelId: live
      # 데이터베이스 보안 규칙(firestore.rules)도 함께 반영
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NO_COLOR: "1"
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          status=0
          out=$(GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15 deploy --only firestore:rules --project heebonyang --non-interactive 2>&1) || status=$?
          rm -f "$RUNNER_TEMP/sa.json"
          echo "$out"
          # Firebase 콘솔에서 Firestore 데이터베이스를 아직 만들지 않았으면 이 단계만 건너뜀
          if [ $status -ne 0 ] && echo "$out" | sed "s/\x1b\[[0-9;]*m//g" | grep -q "Permissions denied enabling firestore.googleapis.com"; then
            echo "::warning::Firestore 데이터베이스가 아직 없어 규칙 반영을 건너뜁니다."
            exit 0
          fi
          exit $status
      # 음원 저장소 보안 규칙(storage.rules)도 함께 반영
      # (Firebase 콘솔에서 Storage를 아직 시작하지 않았으면 실패해도 배포는 계속됨)
      - name: Deploy Storage rules
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NO_COLOR: "1"
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          status=0
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15 deploy --only storage --project heebonyang --non-interactive || status=$?
          rm -f "$RUNNER_TEMP/sa.json"
          if [ $status -ne 0 ]; then echo "::warning::Storage 규칙을 반영하지 못했어요. Firebase 콘솔에서 Storage를 시작했는지 확인하세요."; fi
          exit $status
